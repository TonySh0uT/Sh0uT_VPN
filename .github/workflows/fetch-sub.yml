name: Fetch External Subscription

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare directories
        run: |
          mkdir -p files

      - name: Download VPN1
        run: |
          curl -fL --compressed \
            -c files/cookies1.txt \
            -b files/cookies1.txt \
            "${{ secrets.VPN_SUB_URL }}" \
            -H "accept-language: ru-RU,en,*" \
            -H "accept-encoding: gzip, deflate" \
            -H "x-ver-os: 11_10.0.26200" \
            -H "x-hwid: ${{ secrets.HAPP_HWID }}" \
            -H "x-device-model: DESKTOP" \
            -H "x-device-os: Windows" \
            -H "x-device-locale: RU" \
            -H "x-app-version: 3.3.6" \
            -H "user-agent: Happ/3.3.6/Windows/21111111111" \
            -o files/vpn1

      - name: Download VPN2
        run: |
          curl -fL --compressed \
            -c files/cookies2.txt \
            -b files/cookies2.txt \
            "${{ secrets.VPN_SUB_URL_2 }}" \
            -H "accept-language: ru-RU,en,*" \
            -H "accept-encoding: gzip, deflate" \
            -H "x-ver-os: 11_10.0.26200" \
            -H "x-hwid: ${{ secrets.HAPP_HWID }}" \
            -H "x-device-model: DESKTOP" \
            -H "x-device-os: Windows" \
            -H "x-device-locale: RU" \
            -H "x-app-version: 3.3.6" \
            -H "user-agent: Happ/3.3.6/Windows/21111111111" \
            -o files/vpn2

      - name: Merge subscriptions
        env:
          VPN1_FILE: files/vpn1
          VPN2_FILE: files/vpn2
          OUTPUT_FILE: files/external_sub
        run: |
          python3 merge_subscriptions.py

      - name: Validate final subscription
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open(
              "files/external_sub",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if not isinstance(data, list):
              print(
                  "ERROR: итоговый файл "
                  "не является массивом профилей"
              )
              sys.exit(1)

          vpn1 = []
          vpn2 = []

          for profile in data:
              if not isinstance(profile, dict):
                  continue

              remarks = str(
                  profile.get("remarks", "")
              )

              if remarks.startswith("VPN1 | "):
                  vpn1.append(remarks)

              elif remarks.startswith("VPN2 | "):
                  vpn2.append(remarks)

          print(
              f"Total profiles: {len(data)}"
          )

          print(
              f"VPN1 profiles: {len(vpn1)}"
          )

          print(
              f"VPN2 profiles: {len(vpn2)}"
          )

          print()
          print("First VPN1 profiles:")

          for name in vpn1[:5]:
              print(f"  {name}")

          print()
          print("First VPN2 profiles:")

          for name in vpn2[:5]:
              print(f"  {name}")

          if not vpn1:
              print(
                  "ERROR: VPN1 profiles not found",
                  file=sys.stderr
              )
              sys.exit(1)

          if not vpn2:
              print(
                  "ERROR: VPN2 profiles not found",
                  file=sys.stderr
              )
              sys.exit(1)

          print()
          print("Validation OK")
          PY

      - name: Update release with subscription
        uses: softprops/action-gh-release@v3
        with:
          tag_name: happ-sub
          name: Latest Happ Subscription
          body: |
            Автоматически обновляемая объединённая подписка.
          files: |
            files/external_sub
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}