name: Update Happ Subscription

on:
  schedule:
    - cron: "30 */3 * * *"

  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Download subscription
        run: |
          curl \
            --fail \
            --location \
            --max-time 120 \
            "${{ secrets.VPN_SUB_URL }}" \
            -o public_sub


      - name: Validate
        run: |
          echo "Size:"
          wc -c public_sub

          head -c 50 public_sub


      - name: Prepare Pages
        run: |
          mkdir public
          cp public_sub public/happ-subscription


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public



  deploy:

    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write


    environment:
      name: github-pages


    steps:

      - name: Deploy
        uses: actions/deploy-pages@v4