name: Update Happ Subscription

on:
  push:
    branches:
      - main
    paths:
      - 'servers/**'
      - 'build.py'
      - '.github/workflows/update-subscription.yml'

  schedule:
    - cron: "30 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Build Script
        run: python build.py

      - name: Check output file
        run: |
          echo "Size of sub file:"
          wc -c files/sub

      - name: Update release
        uses: softprops/action-gh-release@v2
        with:
            tag_name: happ-sub
            name: Latest Happ Subscription
            body: |
              Свежий список серверов vless.
            files: files/sub
            make_latest: false
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}