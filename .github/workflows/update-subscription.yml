name: Update Happ Subscription

on:
  schedule:
    - cron: "30 */3 * * *"

  workflow_dispatch:


permissions:
  pages: write
  id-token: write


jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Download original subscription
        run: |
          mkdir public

          curl \
            --fail \
            --location \
            --max-time 120 \
            "${{ secrets.VPN_SUB_URL }}" \
            -o public/sub


      - name: Check
        run: |
          echo "Size:"
          wc -c public/sub

          echo "First chars:"
          head -c 100 public/sub


      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public



  deploy:

    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write


    environment:
      name: github-pages


    steps:

      - name: Deploy
        uses: actions/deploy-pages@v4